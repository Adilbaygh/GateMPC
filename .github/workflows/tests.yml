# The repository claims to run on Windows, macOS and Linux. This is what checks it.
#
# Two things are proved on every push. First that the tests pass on all three systems
# and on every supported Python. Second, and more important for a reproducibility
# package, that the data package survives the round trip through git on each of them:
# `download_usgs.py --verify` recomputes every SHA-256 and compares it with the
# committed SHA256SUMS. If .gitattributes ever stopped protecting DATA/ from line-ending
# conversion, this job would fail on Windows and nowhere else.
#
# No network is needed: the package is in the repository and --verify makes no request.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify the data package against its checksums
        run: python scripts/download_usgs.py --verify

      - name: Run the tests
        run: python -m pytest -q

  explorer:
    # The results explorer is an extra, so it gets its own job: a failure here must not
    # be read as a failure of the reproducibility package. Linux only, because that is
    # where a headless Qt has fonts; the Windows and macOS runners have no desktop
    # session and the offscreen plugin ships no fonts on Windows.
    name: results explorer (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gui.txt pytest

      - name: Install the libraries Qt needs on a headless runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            fonts-dejavu-core

      - name: Render every page in both languages
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          for page in $(python main.py --list-pages | awk '{print $1}'); do
            for language in uz en; do
              python main.py --page "$page" --language "$language" \
                --screenshot "build/gui_shots/${page}_${language}.png"
            done
          done
          ls -l build/gui_shots

      - name: Upload the rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: explorer-pages
          path: build/gui_shots/
          retention-days: 14
